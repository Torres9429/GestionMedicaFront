<div class="container">
  <div class="header">
    <h1 class="title">Citas Médicas</h1>
    <button class="btn-add" (click)="openModal()"><i class="bi bi-plus-lg plus-icon"></i>Agregar Cita</button>
  </div>

  <!-- Tabla de citas -->
  <div class="table-responsive table-container">
    <div class="row g-3 filters-container">
      <div class="col-md-6 filter">
        <label for="filtroMedico" class="form-label text-dark fw-bold">Filtrar por Médico</label>
        <select id="filtroMedico" [(ngModel)]="filtroMedico" (change)="filterCitas(+filtroMedico || 0, 'medico')" class="form-select">
          <option value="">Todos</option>
          <option *ngFor="let medico of medicos" [value]="medico.id">{{ medico.nombre }}</option>
        </select>
      </div>
      <div class="col-md-6 filter">
        <label for="filtroPaciente" class="form-label text-dark fw-bold">Filtrar por Paciente</label>
        <select id="filtroPaciente" [(ngModel)]="filtroPaciente" (change)="filterCitas(+filtroPaciente || 0, 'paciente')" class="form-select">
          <option value="">Todos</option>
          <option *ngFor="let paciente of pacientes" [value]="paciente.id">{{ paciente.nombre }}</option>
        </select>
      </div>
    </div>

    <table class="table table-striped table-hover align-middle">
      <thead class="tabla-header-custom">
        <tr>
          <th>#</th>
          <th>Fecha</th>
          <th>Paciente</th>
          <th>Médico</th>
          <th>Diagnóstico</th>
          <th>Tratamiento</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let cita of citas; let i = index">
          <td>{{ i + 1 }}</td>
          <td>{{ cita.fecha | date: 'short' }}</td>
          <td>{{ cita.paciente?.nombre }}</td>
          <td>{{ cita.medico?.nombre }}</td>
          <td>{{ cita.diagnostico || '—' }}</td>
          <td>{{ cita.tratamiento || '—' }}</td>
          <td>
            <button class="btn-sm btn-principal" (click)="openModal(cita)">Registrar Diagnóstico</button>
            <button class="btn-sm btn-eliminar" (click)="deleteCita(cita.id!)">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Modal -->
  <div class="modal" tabindex="-1" [ngClass]="{ 'show d-block': modalVisible }" style="background-color: rgba(0,0,0,0.5);">
    <div class="modal-dialog">
      <div class="modal-content">
        <form #citaForm="ngForm" (ngSubmit)="saveCita()">
          <div class="modal-header">
            <h5 class="modal-title">{{ isEditing ? 'Diagnóstico y tratamiento' : 'Agregar Cita' }}</h5>
            <button type="button" class="btn-close btn-close-white" aria-label="Close" (click)="closeModal()"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="fecha" class="form-label">Fecha</label>
              <input type="datetime-local" id="fecha" [(ngModel)]="selectedCita.fecha" name="fecha" class="form-control" required [disabled]="isEditing" />
            </div>
            <div class="mb-3">
              <label for="medico" class="form-label">Médico</label>
              <select id="medico" [(ngModel)]="selectedCita.idMedico" name="idMedico" class="form-select" required [disabled]="isEditing">
                <option *ngFor="let medico of medicos" [value]="medico.id">{{ medico.nombre }}</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="paciente" class="form-label">Paciente</label>
              <select id="paciente" [(ngModel)]="selectedCita.idPaciente" name="idPaciente" class="form-select" required [disabled]="isEditing">
                <option *ngFor="let paciente of pacientes" [value]="paciente.id">{{ paciente.nombre }}</option>
              </select>
            </div>
            <div *ngIf="isEditing">
              <div class="mb-3">
                <label for="diagnostico" class="form-label">Diagnóstico</label>
                <input type="text" id="diagnostico" [(ngModel)]="selectedCita.diagnostico" name="diagnostico" class="form-control" />
              </div>
              <div class="mb-3">
                <label for="tratamiento" class="form-label">Tratamiento</label>
                <input type="text" id="tratamiento" [(ngModel)]="selectedCita.tratamiento" name="tratamiento" class="form-control" />
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" (click)="closeModal()">Cancelar</button>
            <button type="submit" class="btn btn-primary">{{ isEditing ? 'Actualizar' : 'Guardar' }}</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
